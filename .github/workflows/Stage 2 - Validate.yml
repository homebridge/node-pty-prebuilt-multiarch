name: Stage 2 - Validate NPM Package contents
run-name: Stage 2 - Validate against ${{ github.ref_name }}

on:
  pull_request:
    branches: [main, beta-*.*.*, beta]
    types: [review_requested, ready_for_review]
  workflow_dispatch:
  workflow_run:
    workflows: ["Stage 1 - Run prebuild's and Create GitHub and NPM release"]
    types:
      - completed
    branches: [main, beta-*.*.*, beta, alpha-*.*.*, alpha]

concurrency:
  group: validate
  cancel-in-progress: true

jobs:
  # Validate that node-pty can be installed and ran across all platforms
  determine_tag:
    name: Determine Tag
    runs-on: ubuntu-latest
    # Only run if the Stage 1 workflow succeeded (for workflow_run) or always for other triggers
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Tag
      id: tag
      run: |
        if [[ ${{ github.ref_name }} == *"beta"* ]]; then
          TAG="beta"
        else
          TAG="latest"
        fi
        echo "Using TAG: $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "::notice::Using TAG: $TAG"

  validate_service_starts:
    name: Validate
    needs: determine_tag
    strategy:
      fail-fast: false
      matrix:
        node-version: [
          26.x,
          25.x,
          24.x,
          23.x,
          22.x,
          21.x,
          20.x,
          19.x]
        os: [
          ubuntu-latest, 
          ubuntu-24.04, 
          ubuntu-22.04, 
          ubuntu-24.04-arm,
          ubuntu-22.04-arm,
          macos-latest,
          macos-26, 
          macos-15,
          macos-26-intel, 
          macos-15-intel, 
          windows-latest, 
          windows-2025, 
          windows-2022, 
          windows-11-arm]
        exclude:
          - os: windows-11-arm
            node-version: 19.x

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - if: runner.os == 'Linux'
        run: cat /etc/os-release

      - if: runner.os == 'Windows'
        run: systeminfo

      - if: runner.os == 'macOS'
        run: sw_vers

      - run: npm install @homebridge/node-pty-prebuilt-multiarch@${{ needs.determine_tag.outputs.tag }}

      - name: Display structure of downloaded files
        run: ls -R

      - run: |
          cd ./node_modules/@homebridge/node-pty-prebuilt-multiarch
          npm run validate

      - run: |
          cd ./node_modules/@homebridge/node-pty-prebuilt-multiarch
          npm run postinstall

      - run: |
          echo "::notice::Successfully tested ${{ github.ref_name }} on ${{ matrix.os }} with Node.js ${{ matrix.node-version }}"
