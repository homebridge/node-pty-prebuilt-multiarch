# Hybrid dependency management configuration
# - npm dependencies: Managed by NorthernMan54/Homebridge-Dependency-Bot (see .github/homebridge-dependency-bot-*.json)
# - Docker base images: Managed by GitHub Dependabot (configured below)

version: 2
updates:
  # Docker base image updates
  - package-ecosystem: docker
    directory: "/.prebuild"
    schedule:
      interval: weekly
      time: "10:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    # Create PRs for out-of-date actions
    open-pull-requests-limit: 10
    target-branch: "latest"
    # Add labels to PRs
    labels:
      - "dependencies"
    # Group related updates together (optional)
    groups:
      actions:
        patterns:
          - "*"
    # Automatically rebase PRs when conflicts occur
    rebase-strategy: "auto"
    # Commit message prefix
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "10:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Group related updates together (optional)
    groups:
      packages:
        patterns:
          - "*"
    # Automatically rebase PRs when conflicts occur
    rebase-strategy: "auto"
    # Commit message prefix
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"